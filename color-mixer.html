<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Mixer - Mix Two Colors with Adjustable Ratio | HexColor Pro</title>
  <meta name="description" content="Mix two colors together with an adjustable ratio. Generate smooth gradient steps between any two colors. Free online color blender tool.">
  <meta name="keywords" content="color mixer, color blender, mix two colors, color gradient generator, gradient steps">
  <link rel="canonical" href="https://hexcolorpro.pages.dev/color-mixer">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface-light: #334155;
      --text: #f1f5f9; --text-muted: #94a3b8; --accent: #6366f1;
      --radius: 12px; --shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; margin-bottom: 20px; }
    .logo {
      font-size: 1.4rem; font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 20px; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--text); }
    .page-header { text-align: center; margin: 20px 0 30px; }
    .page-header h1 {
      font-size: 2.2rem; font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .page-header p { color: var(--text-muted); margin-top: 8px; font-size: 1.05rem; }
    .breadcrumb { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }

    .preview-row {
      display: flex; gap: 20px; margin-bottom: 24px;
      background: var(--surface); border-radius: var(--radius); padding: 28px;
      box-shadow: var(--shadow);
    }
    .preview-swatch {
      width: 140px; height: 140px; border-radius: var(--radius); flex-shrink: 0;
      border: 3px solid var(--surface-light); background: #6366f1;
    }
    .preview-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .preview-info .title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .preview-info .value { font-size: 1.4rem; font-family: 'Courier New', monospace; font-weight: 700; }

    .converter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;
      margin-bottom: 24px;
    }
    .converter-card {
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow);
    }
    .converter-card h3 {
      font-size: 1rem; margin-bottom: 12px; color: var(--accent);
      display: flex; justify-content: space-between; align-items: center;
    }
    .copy-btn {
      padding: 4px 10px; font-size: 0.75rem; border: none; border-radius: 5px;
      background: var(--surface-light); color: var(--text); cursor: pointer; font-weight: 600;
    }
    .copy-btn:hover { background: #475569; }
    .converter-card .field { margin-bottom: 8px; }
    .converter-card label {
      display: block; font-size: 0.75rem; color: var(--text-muted);
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .converter-card input {
      width: 100%; padding: 8px 10px; border: 2px solid var(--surface-light);
      border-radius: 6px; background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace; font-size: 0.9rem;
    }
    .converter-card input:focus { outline: none; border-color: var(--accent); }

    .picker-row {
      display: flex; gap: 12px; align-items: center;
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .picker-row input[type="color"] {
      width: 50px; height: 50px; border: none; border-radius: 8px; cursor: pointer; background: none;
    }
    .picker-row input[type="text"] {
      flex: 1; padding: 14px 16px; border: 2px solid var(--surface-light);
      border-radius: 8px; background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace; font-size: 1rem;
    }
    .picker-row input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .btn {
      padding: 14px 20px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; transition: background 0.2s;
    }
    .btn-secondary { background: var(--surface-light); color: var(--text); }
    .btn-secondary:hover { background: #475569; }

    .ad-placeholder {
      background: var(--surface); border: 2px dashed var(--surface-light);
      border-radius: var(--radius); padding: 24px; text-align: center;
      margin: 24px 0; color: var(--text-muted); font-size: 0.85rem;
      min-height: 90px; display: flex; align-items: center; justify-content: center;
    }
    .ad-slot.ad-live {
      margin: 24px 0; text-align: center; min-height: 0;
      display: block; background: transparent; border: none; padding: 0;
    }

    .guide-section { margin-top: 40px; }
    .guide-section h2 { font-size: 1.5rem; margin-bottom: 16px; }
    .guide-section h3 { font-size: 1.2rem; margin: 20px 0 10px; color: var(--accent); }
    .guide-section p { color: var(--text-muted); margin-bottom: 12px; }
    .guide-section ul { margin: 12px 0 16px 20px; color: var(--text-muted); }
    .guide-section li { margin-bottom: 6px; }

    footer {
      margin-top: 60px; padding: 30px 20px; border-top: 1px solid var(--surface-light);
      color: var(--text-muted); font-size: 0.9rem; text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; margin: 0 8px; }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: white; padding: 12px 24px; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; z-index: 1000; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index" class="logo">🎨 HexColor Pro</a>
      <div class="nav-links">
        <a href="index#tools">All Tools</a>
        <a href="blog">Blog</a>
      </div>
    </nav>

    <div class="breadcrumb"><a href="index">Home</a> / Color Converter</div>

    <div class="page-header">
      <h1>Color Mixer</h1>
      <p>Blend two colors together and generate gradient steps between them.</p>
    </div>

    <div class="ad-slot" data-ad-slot="top" id="adTop">
      <div class="ad-placeholder">Advertisement</div>
    </div>

    


    <div class="ad-slot" data-ad-slot="top" id="adTop">
      <div class="ad-placeholder">Advertisement</div>
    </div>

    <div style="background: var(--surface); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px;">
      <h3 style="margin-bottom: 20px;">Mix Two Colors</h3>
      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;">
        <div style="text-align: center; flex: 1; min-width: 120px;">
          <div id="swatch1" style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 12px; background: #ff0000; border: 4px solid var(--surface-light);"></div>
          <input type="color" id="color1" value="#ff0000" style="width: 100%; height: 40px; cursor: pointer; border: none; border-radius: 8px;">
          <input type="text" id="hex1" value="#FF0000" style="width: 100%; margin-top: 8px; padding: 8px; text-align: center; font-family: monospace; background: var(--surface-light); border: 1px solid var(--surface-light); color: var(--text); border-radius: 6px;">
        </div>
        <div style="font-size: 2rem; color: var(--text-muted);">+</div>
        <div style="text-align: center; flex: 1; min-width: 120px;">
          <div id="swatch2" style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 12px; background: #0000ff; border: 4px solid var(--surface-light);"></div>
          <input type="color" id="color2" value="#0000ff" style="width: 100%; height: 40px; cursor: pointer; border: none; border-radius: 8px;">
          <input type="text" id="hex2" value="#0000FF" style="width: 100%; margin-top: 8px; padding: 8px; text-align: center; font-family: monospace; background: var(--surface-light); border: 1px solid var(--surface-light); color: var(--text); border-radius: 6px;">
        </div>
        <div style="font-size: 2rem; color: var(--text-muted);">=</div>
        <div style="text-align: center; flex: 1; min-width: 140px;">
          <div id="resultSwatch" style="width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 12px; background: #800080; border: 4px solid var(--accent); box-shadow: 0 0 20px rgba(99,102,241,0.4);"></div>
          <div class="value" id="resultHex" style="font-size: 1.2rem; cursor: pointer;">#800080</div>
          <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">(click to copy)</div>
        </div>
      </div>
      
      <div style="margin-top: 24px;">
        <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span>Mix Ratio</span>
          <span id="ratioText">50% / 50%</span>
        </label>
        <input type="range" id="mixRatio" min="0" max="100" value="50" style="width: 100%; accent-color: var(--accent);">
      </div>
    </div>

    <div style="background: var(--surface); border-radius: var(--radius); padding: 24px; margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px;">Gradient Steps</h3>
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
        <label>Steps: 
          <input type="number" id="stepsCount" value="10" min="2" max="30" 
                 style="width: 60px; padding: 6px; background: var(--surface-light); border: 1px solid var(--surface-light); color: var(--text); border-radius: 6px;">
        </label>
        <button id="copyGradientBtn" style="padding: 6px 14px; background: var(--surface-light); color: var(--text); border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">Copy All HEX</button>
      </div>
      <div id="gradientBar" style="display: flex; height: 60px; border-radius: 8px; overflow: hidden;"></div>
    </div>




  <script>
    
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 1500);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function(){ showToast('Copied!'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied!');
      }
    }
    function hexToRgb(hex) {
      var n = parseInt(hex.slice(1), 16);
      return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
    }
    function rgbToHex(r, g, b) {
      return '#' + [r,g,b].map(function(v) {
        v = Math.max(0, Math.min(255, Math.round(v)));
        return v.toString(16).padStart(2,'0');
      }).join('');
    }
    function mixColors(c1, c2, ratio) {
      var rgb1 = hexToRgb(c1);
      var rgb2 = hexToRgb(c2);
      var r = rgb1.r * (1 - ratio) + rgb2.r * ratio;
      var g = rgb1.g * (1 - ratio) + rgb2.g * ratio;
      var b = rgb1.b * (1 - ratio) + rgb2.b * ratio;
      return rgbToHex(r, g, b);
    }
    function updateMixer() {
      var c1 = document.getElementById('color1').value;
      var c2 = document.getElementById('color2').value;
      var ratio = parseInt(document.getElementById('mixRatio').value) / 100;
      document.getElementById('hex1').value = c1.toUpperCase();
      document.getElementById('hex2').value = c2.toUpperCase();
      document.getElementById('swatch1').style.background = c1;
      document.getElementById('swatch2').style.background = c2;
      document.getElementById('ratioText').textContent = Math.round((1-ratio)*100) + '% / ' + Math.round(ratio*100) + '%';
      var result = mixColors(c1, c2, ratio);
      document.getElementById('resultSwatch').style.background = result;
      document.getElementById('resultHex').textContent = result.toUpperCase();
      updateGradient(c1, c2);
    }
    function updateGradient(c1, c2) {
      var steps = parseInt(document.getElementById('stepsCount').value) || 10;
      steps = Math.max(2, Math.min(30, steps));
      var bar = document.getElementById('gradientBar');
      bar.innerHTML = '';
      for (var i = 0; i < steps; i++) {
        var ratio = i / (steps - 1);
        var c = mixColors(c1, c2, ratio);
        var div = document.createElement('div');
        div.style.cssText = 'flex:1; background:'+c+'; cursor:pointer; transition:flex 0.2s;';
        div.title = c.toUpperCase();
        div.addEventListener('click', function(){ copyText(this.title); });
        div.addEventListener('mouseenter', function(){ this.style.flex='1.5'; });
        div.addEventListener('mouseleave', function(){ this.style.flex='1'; });
        bar.appendChild(div);
      }
    }
    document.getElementById('color1').addEventListener('input', updateMixer);
    document.getElementById('color2').addEventListener('input', updateMixer);
    document.getElementById('mixRatio').addEventListener('input', updateMixer);
    document.getElementById('stepsCount').addEventListener('input', updateMixer);
    ['hex1','hex2'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', function() {
        var v = this.value.trim();
        if (!v.startsWith('#')) v = '#' + v;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
          document.getElementById(id === 'hex1' ? 'color1' : 'color2').value = v;
          updateMixer();
        }
      });
    });
    document.getElementById('resultHex').addEventListener('click', function() {
      copyText(this.textContent);
    });
    document.getElementById('copyGradientBtn').addEventListener('click', function() {
      var steps = parseInt(document.getElementById('stepsCount').value) || 10;
      var c1 = document.getElementById('color1').value;
      var c2 = document.getElementById('color2').value;
      var codes = [];
      for (var i = 0; i < steps; i++) {
        codes.push(mixColors(c1, c2, i/(steps-1)).toUpperCase());
      }
      copyText(codes.join(', '));
    });
    updateMixer();
    
  </script>
  <script src="ads.js?v=3"></script>
</body>
</html>
