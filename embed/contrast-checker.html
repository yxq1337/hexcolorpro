<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrast Checker Widget — HexColor Pro</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://hexcolorpro.pages.dev/contrast-checker">
  <style>
    :root { --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #4f46e5; --ok: #047857; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); background: #fff; padding: 12px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
    .field input[type="color"] { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
    .field input[type="text"] { flex: 1; min-width: 0; border: 0; outline: none; font: 13px/1 ui-monospace, "Courier New", monospace; color: var(--fg); text-transform: uppercase; }
    .result { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 8px; }
    .ratio { font-size: 26px; font-weight: 700; }
    .verdict { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .pass { color: var(--ok); background: #ecfdf5; }
    .fail { color: var(--bad); background: #fef2f2; }
    .preview { border-radius: 8px; padding: 14px; text-align: center; border: 1px solid var(--line); }
    .preview strong { display: block; font-size: 18px; }
    .preview span { display: block; font-size: 13px; margin-top: 2px; }
    .badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #f3f4f6; color: var(--muted); }
    .badge.pass { background: #ecfdf5; color: var(--ok); }
    .badge.fail { background: #fef2f2; color: var(--bad); }
    a.brand { display: block; margin-top: 10px; font-size: 11px; color: var(--muted); text-decoration: none; text-align: right; }
    a.brand:hover { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <label for="fgHex">Text</label>
      <div class="field">
        <input type="color" id="fgPicker" value="#111827" aria-label="Text color">
        <input type="text" id="fgHex" value="#111827" spellcheck="false" aria-label="Text color hex">
      </div>
    </div>
    <div>
      <label for="bgHex">Background</label>
      <div class="field">
        <input type="color" id="bgPicker" value="#ffffff" aria-label="Background color">
        <input type="text" id="bgHex" value="#FFFFFF" spellcheck="false" aria-label="Background color hex">
      </div>
    </div>
  </div>

  <div class="result">
    <span class="ratio" id="ratio">21.00:1</span>
    <span class="verdict pass" id="verdict">AAA</span>
  </div>

  <div class="preview" id="preview">
    <strong>Large text</strong>
    <span>Body text sample</span>
  </div>

  <div class="badges">
    <span class="badge" id="aaN">AA normal 4.5:1</span>
    <span class="badge" id="aaL">AA large 3:1</span>
    <span class="badge" id="aaaN">AAA normal 7:1</span>
  </div>

  <a class="brand" href="https://hexcolorpro.pages.dev/contrast-checker" target="_blank" rel="noopener">Contrast check by HexColor Pro →</a>

  <script>
    (function () {
      var fgHex = document.getElementById('fgHex');
      var bgHex = document.getElementById('bgHex');
      var fgPicker = document.getElementById('fgPicker');
      var bgPicker = document.getElementById('bgPicker');
      var preview = document.getElementById('preview');
      var ratioEl = document.getElementById('ratio');
      var verdictEl = document.getElementById('verdict');

      function toRgb(hex) {
        var h = hex.replace('#', '').trim();
        if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
        if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
        return [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
      }
      function lum(rgb) {
        var a = rgb.map(function (v) {
          v /= 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
      }
      function badge(el, pass) {
        el.className = 'badge ' + (pass ? 'pass' : 'fail');
      }
      function update() {
        var fg = toRgb(fgHex.value);
        var bg = toRgb(bgHex.value);
        if (!fg || !bg) return;
        var l1 = lum(fg), l2 = lum(bg);
        var ratio = (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        ratioEl.textContent = ratio.toFixed(2) + ':1';
        preview.style.color = '#' + fg.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
        preview.style.background = '#' + bg.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
        var n = ratio.toFixed(2);
        verdictEl.textContent = ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : ratio >= 3 ? 'AA large' : 'Fail';
        verdictEl.className = 'verdict ' + (ratio >= 4.5 ? 'pass' : ratio >= 3 ? 'fail' : 'fail');
        badge(document.getElementById('aaN'), ratio >= 4.5);
        badge(document.getElementById('aaL'), ratio >= 3);
        badge(document.getElementById('aaaN'), ratio >= 7);
        fgPicker.value = preview.style.color;
        bgPicker.value = preview.style.background;
      }
      [fgHex, bgHex].forEach(function (el) {
        el.addEventListener('input', update);
      });
      [fgPicker, bgPicker].forEach(function (el) {
        el.addEventListener('input', function () {
          if (el === fgPicker) fgHex.value = el.value.toUpperCase();
          else bgHex.value = el.value.toUpperCase();
          update();
        });
      });
      update();
    })();
  </script>
</body>
</html>
